name: Build HexagonOS ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y xorriso grub-pc-bin grub-common mtools

    - name: Build minimal ISO
      run: |
        mkdir -p iso/boot/grub
        cp hexagon-shell.sh iso/boot/
        cat > iso/boot/grub/grub.cfg << 'EOF'
        set timeout=5
        menuentry "HexagonOS 0.1" {
            echo "Hello from HexagonOS 0.1"
            sleep 3
            reboot
        }
        EOF
        grub-mkrescue -o HexagonOS-0.1.iso iso/

    - name: Upload ISO
      uses: actions/upload-artifact@v4
      with:
        name: HexagonOS-0.1-iso
        path: HexagonOS-0.1.iso
